# Package settings for bpdtools, and settings for pytest.

# Build the package with setuptools.
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# Name and version of the project's own package.
[project]
name = "bpdtools"
version = "0.1.0"
description = "Functions for the analysis of Berkeley Police Department open data"
requires-python = ">=3.11"

# Only the bpdtools folder is part of the package.
[tool.setuptools]
packages = ["bpdtools"]

# Settings for pytest.
[tool.pytest.ini_options]
# Look for tests only in the tests folder.
testpaths = ["tests"]
# Put the repository root on the import path, so that the tests import
# bpdtools from this folder even when the package is not installed.
pythonpath = ["."]
# Treat every warning as an error, so that a warning cannot pass unnoticed.
filterwarnings = ["error"]

# Settings for ruff, the linter and formatter that `make lint` runs.
[tool.ruff]
# Longest allowed line, the ruff and black default.
line-length = 88

[tool.ruff.lint]
# E and W: pycodestyle errors and warnings. F: pyflakes (unused imports and
# undefined names). I: import order. D: docstrings. N: pep8 names.
select = ["E", "F", "W", "I", "D", "N"]

# Check docstrings against the NumPy style that the project uses.
[tool.ruff.lint.pydocstyle]
convention = "numpy"
