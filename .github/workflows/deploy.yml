# Build the MyST website and deploy it to GitHub Pages on every push to
# main. In the repository settings, Pages > Source must be "GitHub Actions".
name: deploy website

on:
  push:
    branches: [main]
  # Allow a manual run from the Actions tab.
  workflow_dispatch:

# The site is served from https://<owner>.github.io/<repo>, so every link
# needs /<repo> in front.
env:
  BASE_URL: /${{ github.event.repository.name }}

# Read the repository, and write to Pages with an OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# Run one deployment at a time, and never cancel one that is running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Get the files of the commit on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # MyST runs on Node. Install the same mystmd version as environment.yml;
      # the notebooks are not run again, the site shows their saved outputs.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - name: Install MyST
        run: npm install -g mystmd@1.13.0
      - name: Build the website
        run: myst build --html
      # Hand the built pages to GitHub Pages and publish them.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_build/html
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
